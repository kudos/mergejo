name: Build APK

# Nix-native pipeline (no Docker build image — that was an atomic-Fedora workaround in
# inkventory). Runs on the dedicated NixOS Forgejo runner `build-01` (label
# `nix-host`), which has real Nix + flakes and ample RAM; the flake dev shell
# provides the Android SDK + JDKs (see flake.nix).

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: nix-host

    steps:
      - name: Fix for bad os check
        run: echo "RUNNER_OS=Linux" >> $GITHUB_ENV

      - uses: https://cremin.dev/actions/checkout@v6

      - name: Test & assemble
        # The host executor's per-step workspace copy strips gradlew's exec bit,
        # so run it through bash (read + interpreted) rather than exec'ing it.
        # assembleBenchmark builds the release-shaped, R8-processed benchmark
        # variant — exercises minify/shrink config that the debug build skips.
        run: nix develop -c bash ./gradlew testDebugUnitTest assembleDebug assembleBenchmark --no-daemon

      - name: Publish APKs to package registry
        # Branch pushes only: a tag points at a commit main already published under the same
        # <sha> path, and the registry rejects re-uploads with 409. Tags get a signed release.
        if: github.ref_type != 'tag'
        run: |
          BASE="https://cremin.dev/api/packages/${{ github.repository_owner }}/generic/mergejo/${{ github.sha }}"
          AUTH="Authorization: token ${{ secrets.FORGEJO_REGISTRY_TOKEN }}"
          curl -sS --fail-with-body -X PUT -H "$AUTH" \
            -T app/build/outputs/apk/debug/app-debug.apk \
            "$BASE/mergejo-debug.apk"
          curl -sS --fail-with-body -X PUT -H "$AUTH" \
            -T app/build/outputs/apk/benchmark/app-benchmark.apk \
            "$BASE/mergejo.apk"

  release:
    # Signed release for a v* tag: builds the reproducible release APK (F-Droid checks it against
    # its own build of the tag) and publishes it as a Forgejo release. See scripts/release.sh.
    # Needs repository secrets RELEASE_KEYSTORE_BASE64 (base64 of the .jks), RELEASE_STORE_PASSWORD
    # and RELEASE_KEY_PASSWORD; the release itself is created with the workflow's own token.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: nix-host

    steps:
      - name: Fix for bad os check
        run: echo "RUNNER_OS=Linux" >> $GITHUB_ENV

      - uses: https://cremin.dev/actions/checkout@v6

      - name: Build, sign and publish
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: mergejo
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          # The keystore lives outside the workspace, only for this step.
          export RELEASE_STORE_FILE="$(mktemp)"
          trap 'rm -f "$RELEASE_STORE_FILE"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RELEASE_STORE_FILE"
          nix develop -c bash scripts/release.sh

      - name: Update the F-Droid repository
        # Rebuilds the self-hosted F-Droid repository from the latest releases, including the one
        # just published, and syncs it to the S3 bucket (scripts/fdroid-repo.sh). Skipped until the
        # FDROID_* variables are set. The index signing key comes from FDROID_KEYSTORE_BASE64.
        if: vars.FDROID_REPO_URL != ''
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          FDROID_S3_ACCESS_KEY: ${{ secrets.FDROID_S3_ACCESS_KEY }}
          FDROID_S3_SECRET_KEY: ${{ secrets.FDROID_S3_SECRET_KEY }}
          FDROID_REPO_URL: ${{ vars.FDROID_REPO_URL }}
          FDROID_S3_ENDPOINT: ${{ vars.FDROID_S3_ENDPOINT }}
          FDROID_S3_BUCKET: ${{ vars.FDROID_S3_BUCKET }}
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          export FDROID_KEYSTORE="$(mktemp)"
          trap 'rm -f "$FDROID_KEYSTORE"' EXIT
          printf '%s' "$FDROID_KEYSTORE_BASE64" | base64 -d > "$FDROID_KEYSTORE"
          nix develop .#release -c bash scripts/fdroid-repo.sh
