name: Build APK

# Nix-native pipeline (no Docker build image — that was an atomic-Fedora workaround in
# inkventory). Runs on the dedicated NixOS Forgejo runner `build-01` (label
# `nix-host`), which has real Nix + flakes and ample RAM; the flake dev shell
# provides the Android SDK + JDKs (see flake.nix).

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: nix-host

    steps:
      - name: Fix for bad os check
        run: echo "RUNNER_OS=Linux" >> $GITHUB_ENV

      - uses: https://cremin.dev/actions/checkout@v6

      - name: Test & assemble
        # The host executor's per-step workspace copy strips gradlew's exec bit,
        # so run it through bash (read + interpreted) rather than exec'ing it.
        # assembleBenchmark builds the release-shaped, R8-processed benchmark
        # variant — exercises minify/shrink config that the debug build skips.
        run: nix develop -c bash ./gradlew testDebugUnitTest assembleDebug assembleBenchmark --no-daemon

      - name: Publish debug APK to the package registry
        if: ${{ github.event_name == 'push' }}
        env:
          REG: https://cremin.dev/api/packages/${{ github.repository_owner }}/generic/mergejo
          TOKEN: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          BENCH=app/build/outputs/apk/benchmark/app-benchmark.apk

          # PUT an immutable artifact. Forgejo's generic registry rejects
          # overwrites with 409, so a re-run on an already-published commit is a
          # success (the immutable artifact is already there), not a failure.
          put_immutable() {
            local status
            status=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT \
              -H "Authorization: token $TOKEN" -T "$1" "$2")
            case "$status" in
              2*)  echo "uploaded $2 ($status)" ;;
              409) echo "already published $2 (409) — skipping" ;;
              *)   echo "upload failed $2 ($status)" >&2; return 1 ;;
            esac
          }

          # Immutable per-commit artifact.
          put_immutable "$APK" "$REG/${{ github.sha }}/mergejo-debug.apk"

          # Per-commit benchmark APK (profileable, R8-shrunk) for on-device
          # macrobenchmarks — per-commit only, no rolling "latest".
          put_immutable "$BENCH" "$REG/${{ github.sha }}/mergejo-benchmark.apk"

          # Rolling "latest" on the default branch (replace the previous upload).
          if [ "${{ github.ref_name }}" = "$DEFAULT_BRANCH" ]; then
            curl -sS -X DELETE -H "Authorization: token $TOKEN" "$REG/latest/mergejo-debug.apk" || true
            curl -sS --fail-with-body -X PUT -H "Authorization: token $TOKEN" \
              -T "$APK" "$REG/latest/mergejo-debug.apk"
          fi

          # Tag builds get a tag-named artifact.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            put_immutable "$APK" "$REG/${{ github.ref_name }}/mergejo-${{ github.ref_name }}.apk"
          fi
