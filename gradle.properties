# Conservative defaults so the build fits on small machines: a single, modestly-sized JVM,
# no daemon, no parallel workers, Kotlin in-process. Override per machine in
# ~/.gradle/gradle.properties (it takes precedence over this file).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.vfs.watch=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process

# No Java toolchains: the build compiles with the JDK that runs Gradle (JAVA_HOME) and
# targets Java 17 bytecode. Never auto-provision a JDK.
org.gradle.java.installations.auto-download=false
