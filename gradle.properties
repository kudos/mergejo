# This build box is RAM-constrained (~3.7 GB, no swap). Keep everything inside a
# single, modestly-sized JVM: no daemon, no parallel workers, Kotlin in-process.
# A 4 GB heap (the AS default) gets OOM-killed here mid-configuration.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.vfs.watch=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process

# Nix-native toolchain: use the JDKs the flake dev shell exports (JDK_17 / JDK_21)
# and never auto-provision one via foojay. The Kotlin/AGP toolchain resolves JDK 17;
# the build JVM runs on JAVA_HOME (jdk21) from the flake.
org.gradle.java.installations.fromEnv=JDK_17,JDK_21
org.gradle.java.installations.auto-download=false
